<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>HateClip</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="panel">
  <div class="shell">
    <div class="top">
      <input id="search" class="search" type="text" placeholder="Search clipboard history" autocomplete="off" spellcheck="false">
      <div class="filters" id="filters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="text">Text</button>
        <button class="chip" data-filter="image">Images</button>
        <button class="chip" data-filter="files">Files</button>
        <button class="chip" data-filter="pinned">Pinned</button>
      </div>
      <select id="source" class="source" title="Show items copied from one app" aria-label="Filter by app">
        <option value="">All apps</option>
      </select>
      <button class="icon-btn" id="settings-btn" title="Settings (Cmd+,)" aria-label="Settings">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M3.4 12.6l1.4-1.4M11.2 4.8l1.4-1.4"/></svg>
      </button>
    </div>
    <div class="main">
      <div class="list" id="list" role="listbox" aria-label="Clipboard history"></div>
      <div class="preview">
        <div class="preview-body" id="preview"></div>
        <div class="preview-meta" id="preview-meta"></div>
      </div>
    </div>
    <div class="footer">
      <span><kbd>Enter</kbd> Paste</span>
      <span><kbd>Shift Enter</kbd> Plain text</span>
      <span><kbd>Option Enter</kbd> Copy only</span>
      <span><kbd>Cmd P</kbd> Pin</span>
      <span><kbd>Cmd Delete</kbd> Remove</span>
      <span class="spacer"></span>
      <span id="count"></span>
    </div>
    <div class="toast" id="toast"></div>
  </div>
  <script src="panel.js"></script>
</body>
</html>
