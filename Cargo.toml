[workspace]
resolver = "2"
members = ["crates/hateclip-core", "crates/hateclip-macos", "app"]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["png", "tiff", "jpeg"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
